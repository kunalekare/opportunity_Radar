<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="radarPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Crosshairs -->
  <line x1="256" y1="66" x2="256" y2="446" stroke="#1e293b" stroke-width="2"/>
  <line x1="66" y1="256" x2="446" y2="256" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Radar sweep wedge -->
  <path d="M 256 256 L 256 76 A 180 180 0 0 1 383 128 Z" fill="url(#beam)"/>
  
  <!-- Center Radar Hub -->
  <circle cx="256" cy="256" r="14" fill="#38bdf8"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>
  
  <!-- Opportunity blips / targets -->
  <circle cx="330" cy="170" r="7" fill="#10b981"/>
  <circle cx="330" cy="170" r="14" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>

  <circle cx="180" cy="200" r="6" fill="#f59e0b"/>
  <circle cx="350" cy="320" r="8" fill="#6366f1"/>
  <circle cx="210" cy="340" r="5" fill="#ec4899"/>
</svg>
